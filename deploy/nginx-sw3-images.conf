# nginx reverse-proxy for SW3 Images as a subdomain.
# The keyword-bearing subdomain "images.sustainablewww.se" is good for SEO
# (keyword in URL measurably lifts click-through rate).
# 1. Point an A/AAAA record for the subdomain at your Raspberry Pi's IP.
# 2. Drop this in /etc/nginx/sites-available/sw3-images, symlink to sites-enabled.
# 3. sudo certbot --nginx -d images.sustainablewww.se   (adds the TLS block)
# 4. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name images.sustainablewww.se;

    # Uploads: 50 files x 30 MB max — without this nginx cuts uploads at 1 MB.
    client_max_body_size 1600m;

    # Large uploads + slow compression need patient timeouts.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:2500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
