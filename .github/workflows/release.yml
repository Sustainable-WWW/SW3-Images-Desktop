# Builds installers for macOS (Apple Silicon and Intel) and Windows, signed
# for the in-app updater, and publishes them as a GitHub Release together with
# the latest.json manifest the updater reads.
#
# Both macOS builds run on the self-hosted Mac (runner labels: self-hosted,
# macOS, ARM64), one after the other; the Intel build is cross-compiled there
# (no Rosetta needed). Windows builds on GitHub's runner. The Mac must be
# awake with its runner online: otherwise the macOS builds wait in the queue
# (up to 24 hours) and the release only has the Windows installer until they
# have run.
#
# To release: bump `version` in src-tauri/Cargo.toml, describe the changes
# under a matching heading in CHANGELOG.md (these become the release notes),
# commit, then
#   git tag v0.2.0 && git push origin main v0.2.0
# Don't create the release by hand on GitHub — this workflow creates it and
# attaches the installers when the builds finish (about 20 minutes). Don't
# delete a version's tag either: to redo a release, bump the version and push
# a new tag. When pushing through a mirror, create tags locally and push them
# to the mirror's source; tags made on GitHub are removed by the next sync.
#
# Requires the repository secret TAURI_SIGNING_PRIVATE_KEY: the full contents
# of ~/.tauri/sw3-images-updater.key. If the key has a password, also set
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: [self-hosted, macOS, ARM64]
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match the app version
        shell: bash
        run: |
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a version tag (v$version), not a branch."
            exit 1
          fi
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src-tauri/Cargo.toml version $version"
            exit 1
          fi

      # A re-run after the tag was deleted can't publish (the workflow may not
      # recreate tags), so stop right away with a clear message.
      - name: Tag still exists on GitHub
        shell: bash
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$GITHUB_REF_NAME" >/dev/null; then
            echo "::error::The tag $GITHUB_REF_NAME no longer exists on GitHub (was it deleted together with its release?). Re-running can't bring it back — push a new version tag instead."
            exit 1
          fi

      # Fails in seconds with a clear message instead of after a 10-minute build.
      - name: Updater signing key is configured
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing. Add it under Settings → Secrets and variables → Actions (value: the full contents of ~/.tauri/sw3-images-updater.key)."
            exit 1
          fi
          if ! printf '%s' "$KEY" | base64 --decode 2>/dev/null | grep -q "secret key"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY doesn't look like a Tauri private key. Paste the contents of ~/.tauri/sw3-images-updater.key (not the .pub file)."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Only on GitHub's runners: the self-hosted Mac keeps its own Cargo
      # download cache, which this action's cleanup would prune.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      # mozjpeg's x86 SIMD kernels are written in NASM assembly.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      # setup-nasm only has Intel macOS binaries, which an Apple Silicon Mac
      # can't run without Rosetta: use Homebrew's native NASM instead (it
      # assembles Intel code just the same).
      - name: Install NASM (macOS Intel build)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          command -v nasm >/dev/null || brew install nasm
          nasm -v

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run the test suite before shipping
        run: |
          npm test
          cargo test --workspace --locked

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for $version (expected a heading like: ## [$version])"
            exit 1
          fi
          {
            echo "body<<EOF_NOTES"
            echo "$notes"
            echo
            echo "---"
            echo
            echo "**macOS:** download the \`_aarch64.dmg\` for Macs with Apple Silicon (M1 or newer), or the \`_x64.dmg\` for Intel Macs (Apple menu → About This Mac shows Chip or Processor). Open it and drag SW3 Images to Applications. The first time, right-click the app → Open (or System Settings → Privacy & Security → Open Anyway), because the app isn't notarized by Apple."
            echo
            echo "**Windows:** download and run the \`-setup.exe\`. If SmartScreen warns, click More info → Run anyway."
            echo
            echo "Already installed? The app updates itself."
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SW3 Images ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
