# Runs the full test suite on every push and pull request, on both platforms
# the app ships for, plus a scan of all dependencies for known vulnerabilities.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # mozjpeg's x86 SIMD kernels are written in NASM assembly.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: UI tests (helpers + static security checks)
        run: npm test

      - name: Rust tests (engine, file safety, batch pipeline, security config)
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness -D clippy::suspicious

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Check dependencies for known vulnerabilities (RustSec)
        run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check npm dependencies
        run: npm audit --omit=optional --audit-level=high
