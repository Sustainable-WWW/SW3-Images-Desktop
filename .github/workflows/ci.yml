# Runs the full test suite on every push and pull request, on both platforms
# the app ships for, plus dependency checks: known vulnerabilities, licenses
# that allow redistribution, and up-to-date third-party license notices.
# The macOS tests run on the self-hosted Mac (see `runs-on` below).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            self_hosted: true
          - name: Windows
            os: windows-latest
    # macOS runs on the self-hosted Mac (labels: self-hosted, macOS, ARM64),
    # except pull requests from forks, which use GitHub's macOS runner so
    # outside code doesn't run on the Mac. A pull request can edit this file,
    # though: the real safeguard is requiring approval before fork pull
    # requests run workflows (Settings → Actions → General).
    runs-on: ${{ matrix.self_hosted && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Only on GitHub's runners: the self-hosted Mac keeps its own Cargo
      # download cache, which this action's cleanup would prune.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'

      # mozjpeg's x86 SIMD kernels are written in NASM assembly.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: UI tests (helpers + static security checks)
        run: npm test

      - name: Rust tests (engine, color accuracy, file safety, batch pipeline, security config)
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness -D clippy::suspicious

  dependencies:
    name: Dependencies (vulnerabilities + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
          arguments: --workspace

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Third-party license notices are up to date
        run: |
          python3 scripts/generate-licenses.py
          git diff --exit-code -- THIRD-PARTY-LICENSES.md ui/licenses.html || {
            echo "::error::Dependencies changed: run 'python3 scripts/generate-licenses.py' and commit the result."
            exit 1
          }

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: npm dependencies
        run: npm audit --omit=optional --audit-level=high
