[package]
name = "sw3-images-desktop"
# The app version (shown in the UI and used by the updater) comes from here.
version = "0.1.0"
edition = "2021"
description = "SW3 Images — compress, resize and convert images for the web"
license = "MIT"
default-run = "sw3-images-desktop"

[lib]
name = "sw3_images_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sw3-images = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
image = "0.25"
