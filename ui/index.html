<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SW3 Images</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>

<!-- Shared icon sprite: every tile/row references these instead of cloning SVG. -->
<svg class="sprite" aria-hidden="true">
  <symbol id="i-image" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.6-3.6a2 2 0 0 0-2.8 0L5 21"/></g></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></g></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></g></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></g></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9Z"/></symbol>
</svg>

<header class="titlebar" data-tauri-drag-region>
  <h1 id="app-title" data-tauri-drag-region>SW3 <span>Images</span></h1>
  <div class="update" id="update" hidden>
    <svg class="ico"><use href="#i-sparkle"/></svg>
    <span id="update-text">A new version is available</span>
    <button class="btn-link" id="update-btn" type="button">Update &amp; restart</button>
  </div>
</header>

<!-- ============================ Setup view ============================ -->
<main class="view setup" id="setup">
  <section class="card files" id="files-card">
    <!-- Empty state: one big drop target -->
    <div class="drop drop-empty" id="drop-empty">
      <div class="drop-icon big"><svg class="ico"><use href="#i-upload"/></svg></div>
      <p class="drop-title">Drop images or folders here</p>
      <p class="drop-sub">or <button type="button" class="link" data-browse>browse files</button></p>
      <p class="drop-types">JPG, PNG, WEBP · as many as you like</p>
    </div>

    <!-- With files: compact drop bar + grid -->
    <div class="drop drop-bar" id="drop-bar" hidden>
      <div class="drop-icon"><svg class="ico"><use href="#i-upload"/></svg></div>
      <p><strong>Drop more images</strong> or <button type="button" class="link" data-browse>browse files</button></p>
      <span class="drop-types">JPG, PNG, WEBP</span>
    </div>
    <div class="files-head" id="files-head" hidden>
      <p><strong id="count"></strong> · <span id="total-size"></span></p>
      <button type="button" class="btn-text" id="clear">Clear all</button>
    </div>
    <div class="grid scroll" id="grid" hidden></div>
    <div class="scanning" id="scanning" hidden>Reading images…</div>
  </section>

  <aside class="card options">
    <h2>Output size</h2>
    <label class="choice" id="choice-original">
      <input type="radio" name="size" value="original" checked>
      <span class="mark radio"></span>
      <span class="choice-text"><strong>Original size</strong><small>Keep original dimensions</small></span>
    </label>
    <label class="choice" id="choice-max">
      <input type="radio" name="size" value="max">
      <span class="mark radio"></span>
      <span class="choice-text"><strong>Max width</strong><small>Resize wider images down</small></span>
      <span class="px-field">
        <input type="text" inputmode="numeric" id="max-width" value="1920" maxlength="4" aria-label="Max width in pixels">
        <span class="px">px</span>
      </span>
    </label>

    <h2>Format</h2>
    <label class="choice" id="choice-webp">
      <input type="checkbox" id="webp">
      <span class="mark check"><svg class="ico"><use href="#i-check"/></svg></span>
      <span class="choice-text"><strong>Convert to WEBP</strong><small>Smaller files, keeps quality</small></span>
    </label>

    <div class="spacer"></div>

    <div class="save-to">
      <svg class="ico"><use href="#i-folder"/></svg>
      <div class="save-text"><small>Save to</small><strong id="out-label">…</strong></div>
      <button type="button" class="btn-text" id="change-dir">Change</button>
    </div>
    <button type="button" class="btn-primary big" id="compress" disabled>
      <span id="compress-label">Add images to start</span>
      <svg class="ico"><use href="#i-arrow"/></svg>
    </button>
  </aside>
</main>

<!-- =========================== Progress view =========================== -->
<main class="view run" id="run" hidden>
  <section class="hero">
    <div class="hero-top">
      <div>
        <p class="hero-label" id="hero-label"></p>
        <p class="hero-title" id="hero-title"></p>
      </div>
      <div class="hero-right">
        <p class="hero-pct" id="hero-pct">0%</p>
        <p class="hero-eta" id="hero-eta"></p>
      </div>
    </div>
    <div class="bar"><div class="bar-fill" id="hero-bar"></div></div>
    <p class="hero-stats">
      <span id="hero-bytes"></span>
      <span id="hero-saved"></span>
    </p>
  </section>

  <section class="card list scroll" id="list"></section>

  <footer class="actions">
    <button type="button" class="btn-secondary" id="stop">Stop</button>
    <button type="button" class="btn-primary" id="show-folder">
      <svg class="ico"><use href="#i-folder"/></svg>
      <span>Show in folder</span>
    </button>
  </footer>
</main>

<!-- Row + tile templates, cloned by app.js (text is always set via textContent). -->
<template id="tpl-tile">
  <div class="tile" role="listitem">
    <div class="thumb"><svg class="ico"><use href="#i-image"/></svg></div>
    <p class="tile-name"></p>
    <button type="button" class="remove" aria-label="Remove"><svg class="ico"><use href="#i-x"/></svg></button>
  </div>
</template>

<template id="tpl-row">
  <div class="row">
    <div class="thumb sm"><svg class="ico"><use href="#i-image"/></svg></div>
    <p class="row-name"></p>
    <p class="row-dims"></p>
    <p class="row-size"></p>
    <div class="row-status"></div>
  </div>
</template>

<div class="toast" id="toast" role="status" hidden></div>
<div class="drag-veil" id="drag-veil" hidden><div><svg class="ico"><use href="#i-upload"/></svg><p>Drop to add images</p></div></div>
</body>
</html>
